<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Mage Hit / Barrier Shatter Sprite -->
  <defs>
    <radialGradient id="hitGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#hitGlowM)"/>

  <!-- Shattered Magic Barrier Shards -->
  <polygon points="50,40 65,30 60,50" fill="#38bdf8" opacity="0.8"/>
  <polygon points="30,80 45,95 25,100" fill="#a855f7" opacity="0.8"/>
  <polygon points="40,140 60,135 50,155" fill="#38bdf8" opacity="0.8"/>
  <polygon points="160,80 175,70 180,90" fill="#f43f5e" opacity="0.8"/>

  <g transform="translate(15, 6) rotate(12, 100, 100)">
    <!-- Red Tinted Robe -->
    <path d="M72,80 L45,175 L145,175 L128,80 Z" fill="#7f1d1d"/>
    <path d="M84,80 L75,175 L115,175 L116,80 Z" fill="#991b1b"/>

    <!-- Staff tilted back with cracked orb -->
    <rect x="150" y="55" width="6" height="135" rx="3" fill="#451a03" transform="rotate(25, 150, 100)"/>
    <circle cx="168" cy="50" r="12" fill="#ef4444" opacity="0.7"/>

    <!-- Head & Beard -->
    <circle cx="100" cy="58" r="20" fill="#fed7aa"/>
    <!-- Distressed Expression -->
    <path d="M90,56 L96,52 M110,56 L104,52" stroke="#450a0a" stroke-width="2.5"/>
    <ellipse cx="100" cy="62" rx="4" ry="5" fill="#450a0a"/>
    <path d="M86,68 Q100,105 114,68 Z" fill="#e2e8f0"/>

    <!-- Tilted Hat -->
    <ellipse cx="100" cy="48" rx="38" ry="10" fill="#450a0a"/>
    <path d="M75,46 L100,6 L125,46 Z" fill="#7f1d1d"/>
  </g>
</svg>
