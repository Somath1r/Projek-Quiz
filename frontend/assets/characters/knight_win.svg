<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Knight Victory Sprite (Gold glow, sword held high) -->
  <defs>
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="90" r="85" fill="url(#winGlow)"/>

  <!-- Golden Stars / Sparkles -->
  <path d="M40,40 L45,50 L55,55 L45,60 L40,70 L35,60 L25,55 L35,50 Z" fill="#fde047"/>
  <path d="M160,30 L163,38 L171,42 L163,46 L160,54 L157,46 L149,42 L157,38 Z" fill="#fde047"/>
  <path d="M170,120 L173,126 L179,129 L173,132 L170,138 L167,132 L161,129 L167,126 Z" fill="#fde047"/>

  <!-- Cape Billowing -->
  <path d="M60,80 L30,140 L80,150 Z" fill="#dc2626"/>
  <path d="M140,80 L170,140 L120,150 Z" fill="#b91c1c"/>

  <!-- Body Armor -->
  <rect x="75" y="80" width="50" height="60" rx="8" fill="#475569" stroke="#f1f5f9" stroke-width="4"/>
  <path d="M85,90 L115,90 L100,125 Z" fill="#38bdf8"/>

  <!-- Legs -->
  <rect x="78" y="140" width="16" height="32" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="106" y="140" width="16" height="32" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Sword Raised in Victory (Vertical pointing skyward) -->
  <path d="M125,10 L130,95 L120,95 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
  <rect x="112" y="95" width="26" height="6" rx="2" fill="#fbbf24"/>
  <rect x="122" y="101" width="6" height="18" fill="#78350f"/>

  <!-- Shield by Side -->
  <path d="M45,95 Q45,140 65,150 Q85,140 85,95 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="3"/>

  <!-- Helmet & Plume (Crest High) -->
  <circle cx="100" cy="55" r="28" fill="#64748b" stroke="#f1f5f9" stroke-width="4"/>
  <path d="M86,52 L114,52 M100,52 L100,68" stroke="#090d16" stroke-width="5"/>
  <path d="M88,52 L112,52" stroke="#38bdf8" stroke-width="2"/>
  <path d="M96,25 Q100,5 120,20 Q105,32 100,32 Z" fill="#fbbf24"/>
</svg>
