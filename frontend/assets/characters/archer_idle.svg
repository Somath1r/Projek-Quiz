<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Archer Idle Sprite (Forest Green Hunter) -->
  <defs>
    <radialGradient id="archerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="180" rx="42" ry="10" fill="#0f172a" opacity="0.6"/>
  <circle cx="100" cy="95" r="70" fill="url(#archerGlow)"/>

  <!-- Quiver on Back -->
  <rect x="115" y="70" width="14" height="45" rx="3" fill="#854d0e" transform="rotate(25, 120, 90)"/>
  <path d="M130,55 L135,70 M134,53 L139,68 M138,56 L143,71" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="130" cy="55" r="3" fill="#f59e0b"/>
  <circle cx="134" cy="53" r="3" fill="#f59e0b"/>

  <!-- Cloak / Tunic -->
  <path d="M72,82 L58,145 L142,145 L128,82 Z" fill="#15803d" filter="url(#shadowA)"/>
  <rect x="76" y="80" width="48" height="55" rx="6" fill="#16a34a"/>
  <!-- Belt & Pouch -->
  <rect x="74" y="118" width="52" height="10" fill="#78350f"/>
  <rect x="94" y="116" width="12" height="14" rx="2" fill="#eab308"/>

  <!-- Legs & Boots -->
  <rect x="80" y="142" width="16" height="30" fill="#713f12"/>
  <rect x="104" y="142" width="16" height="30" fill="#713f12"/>
  <rect x="76" y="165" width="22" height="12" rx="4" fill="#451a03"/>
  <rect x="102" y="165" width="22" height="12" rx="4" fill="#451a03"/>

  <!-- Wooden Bow (Left Hand) -->
  <path d="M52,50 Q32,105 52,160" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M52,52 L52,158" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Head & Archer Cap -->
  <circle cx="100" cy="56" r="22" fill="#fbcfe8"/>
  <!-- Eyes -->
  <circle cx="94" cy="56" r="3" fill="#0f172a"/>
  <circle cx="106" cy="56" r="3" fill="#0f172a"/>
  <path d="M97,64 Q100,67 103,64" stroke="#e11d48" stroke-width="1.5" fill="none"/>

  <!-- Cap with Feather -->
  <path d="M76,48 Q100,28 124,48 L126,52 L74,52 Z" fill="#14532d"/>
  <path d="M110,40 Q130,15 140,25 Q130,35 115,42 Z" fill="#ef4444"/>
</svg>
