<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Mage Victory Sprite -->
  <defs>
    <radialGradient id="winGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="90" r="85" fill="url(#winGlowM)"/>

  <!-- Magic Sparkles & Runes -->
  <circle cx="50" cy="50" r="4" fill="#fde047"/>
  <circle cx="150" cy="40" r="5" fill="#fde047"/>
  <circle cx="40" cy="120" r="3" fill="#38bdf8"/>
  <circle cx="165" cy="115" r="4" fill="#38bdf8"/>
  <!-- Magic Rune Ring Around Mage -->
  <ellipse cx="100" cy="110" rx="60" ry="20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,6"/>

  <!-- Robe -->
  <path d="M72,80 L45,175 L155,175 L128,80 Z" fill="#581c87"/>
  <path d="M84,80 L80,175 L120,175 L116,80 Z" fill="#7e22ce"/>
  <path d="M45,175 L155,175" stroke="#facc15" stroke-width="6"/>

  <!-- Staff in Center Pointing to Sky with Blazing Orb -->
  <rect x="97" y="30" width="6" height="145" rx="3" fill="#78350f"/>
  <circle cx="100" cy="20" r="16" fill="#38bdf8"/>
  <circle cx="100" cy="20" r="8" fill="#ffffff"/>

  <!-- Head & Smiling Expression -->
  <circle cx="100" cy="62" r="20" fill="#fed7aa"/>
  <!-- Happy Closed Eyes (^ ^) -->
  <path d="M92,60 Q96,55 100,60" stroke="#1e1b4b" stroke-width="2.5" fill="none"/>
  <path d="M102,60 Q106,55 110,60" stroke="#1e1b4b" stroke-width="2.5" fill="none"/>
  <path d="M86,68 Q100,105 114,68 Z" fill="#f8fafc"/>

  <!-- Hat -->
  <ellipse cx="100" cy="52" rx="38" ry="10" fill="#3b0764"/>
  <path d="M75,50 L100,10 L125,50 Z" fill="#6b21a8"/>
  <path d="M75,48 L125,48" stroke="#facc15" stroke-width="4"/>
</svg>
