<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Knight Idle Sprite (Retro Arcade Style) -->
  <defs>
    <radialGradient id="knightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Shadow & Glow -->
  <ellipse cx="100" cy="180" rx="45" ry="12" fill="#0f172a" opacity="0.6"/>
  <circle cx="100" cy="95" r="70" fill="url(#knightGlow)"/>

  <!-- Cape -->
  <path d="M70,80 L50,160 L85,150 Z" fill="#b91c1c" filter="url(#shadow)"/>
  <path d="M130,80 L150,160 L115,150 Z" fill="#991b1b" filter="url(#shadow)"/>

  <!-- Body Armor -->
  <rect x="75" y="80" width="50" height="60" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <path d="M85,90 L115,90 L100,125 Z" fill="#38bdf8" opacity="0.9"/>
  <!-- Belt -->
  <rect x="73" y="125" width="54" height="12" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="94" y="123" width="12" height="16" fill="#fbbf24"/>

  <!-- Legs & Boots -->
  <rect x="80" y="140" width="16" height="32" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="104" y="140" width="16" height="32" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="76" y="165" width="22" height="12" rx="4" fill="#1e293b"/>
  <rect x="102" y="165" width="22" height="12" rx="4" fill="#1e293b"/>

  <!-- Shield (Left Hand) -->
  <path d="M45,85 Q45,135 65,150 Q85,135 85,85 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="4" filter="url(#shadow)"/>
  <path d="M65,95 L65,135 M52,110 L78,110" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

  <!-- Sword (Right Hand) -->
  <path d="M140,60 L144,130 L136,130 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="130" y="130" width="20" height="6" rx="2" fill="#fbbf24"/>
  <rect x="137" y="136" width="6" height="16" fill="#78350f"/>

  <!-- Helmet & Head -->
  <circle cx="100" cy="55" r="28" fill="#64748b" stroke="#cbd5e1" stroke-width="4" filter="url(#shadow)"/>
  <!-- Visor Slit (T-Shape) -->
  <path d="M86,52 L114,52 M100,52 L100,68" stroke="#090d16" stroke-width="6" stroke-linecap="square"/>
  <path d="M88,52 L112,52" stroke="#38bdf8" stroke-width="2"/>
  <!-- Helmet Crest / Plume -->
  <path d="M96,25 Q100,10 115,22 Q105,32 100,32 Z" fill="#ef4444"/>
</svg>
