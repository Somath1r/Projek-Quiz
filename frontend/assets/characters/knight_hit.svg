<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Knight Hit / Shield Block Sprite (Red flash & impact) -->
  <defs>
    <radialGradient id="hitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Impact Flash -->
  <circle cx="100" cy="100" r="90" fill="url(#hitGlow)"/>

  <!-- Sparks & Impact Lines -->
  <path d="M40,50 L20,35 M50,110 L20,115 M45,150 L15,165" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <path d="M150,50 L175,35 M150,110 L180,115 M150,150 L180,165" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>

  <!-- Character Stagger Group (Angled back) -->
  <g transform="translate(10, 5) rotate(6, 100, 100)">
    <!-- Cape fluttering back -->
    <path d="M70,80 L40,165 L85,150 Z" fill="#991b1b"/>
    <path d="M130,80 L160,165 L115,150 Z" fill="#7f1d1d"/>

    <!-- Armor (flashing red tint) -->
    <rect x="75" y="80" width="50" height="60" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="4"/>
    <rect x="73" y="125" width="54" height="12" fill="#450a0a"/>

    <!-- Legs -->
    <rect x="75" y="140" width="16" height="30" fill="#450a0a" stroke="#b91c1c" stroke-width="2"/>
    <rect x="105" y="140" width="16" height="30" fill="#450a0a" stroke="#b91c1c" stroke-width="2"/>

    <!-- Shield in Center Guard -->
    <path d="M55,70 Q55,135 80,150 Q105,135 105,70 Z" fill="#dc2626" stroke="#fecaca" stroke-width="4"/>
    <path d="M80,85 L80,135 M65,100 L95,100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

    <!-- Helmet (flashing) -->
    <circle cx="100" cy="55" r="28" fill="#991b1b" stroke="#fca5a5" stroke-width="4"/>
    <path d="M86,52 L114,52" stroke="#fef08a" stroke-width="6"/>
  </g>
</svg>
