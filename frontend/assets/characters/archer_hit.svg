<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Archer Hit / Recoil Sprite -->
  <defs>
    <radialGradient id="hitGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#hitGlowA)"/>

  <!-- Damage Impact Marks -->
  <path d="M35,60 L15,45 M30,110 L10,120 M40,150 L20,165" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(15, 8) rotate(10, 100, 100)">
    <!-- Quiver scattering -->
    <rect x="125" y="75" width="14" height="45" rx="3" fill="#451a03" transform="rotate(40, 130, 95)"/>

    <!-- Tunic (Red tinted) -->
    <path d="M72,82 L50,145 L135,145 L128,82 Z" fill="#991b1b"/>
    <rect x="76" y="80" width="48" height="55" rx="6" fill="#b91c1c"/>

    <!-- Legs recoiling -->
    <rect x="72" y="142" width="16" height="28" fill="#451a03"/>
    <rect x="108" y="142" width="16" height="28" fill="#451a03"/>

    <!-- Bow slipped -->
    <path d="M42,70 Q22,125 42,175" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Head with Hurt Expression -->
    <circle cx="100" cy="56" r="22" fill="#fecdd3"/>
    <!-- Closed Hurt Eyes (> <) -->
    <path d="M90,54 L96,58 L90,62" stroke="#881337" stroke-width="2.5" fill="none"/>
    <path d="M110,54 L104,58 L110,62" stroke="#881337" stroke-width="2.5" fill="none"/>
    <ellipse cx="100" cy="67" rx="4" ry="5" fill="#881337"/>

    <!-- Cap knocked back -->
    <path d="M76,46 Q100,24 124,46 L126,50 L74,50 Z" fill="#7f1d1d"/>
  </g>
</svg>
